<!-- index.html -->
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>永續報告書批次下載</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eff5f3;
      color: #14352e;
      font: 1rem/1.6 system-ui, "Microsoft JhengHei", sans-serif;
    }
    main { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
    form {
      padding: 1.5rem;
      border: 1px solid #c8d8d2;
      border-radius: 1rem;
      background: white;
    }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 650; }
    label:first-child { margin-top: 0; }
    select, textarea {
      display: block;
      width: 100%;
      padding: .65rem;
      border: 1px solid #8ba39b;
      border-radius: .4rem;
      color: inherit;
      background: white;
      font: inherit;
    }
    textarea { resize: vertical; }
    button, .download {
      display: inline-block;
      padding: .65rem 1rem;
      border: 0;
      border-radius: .45rem;
      background: #146351;
      color: white;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #16735d; outline-offset: 3px; }
    .note { color: #435e57; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>永續報告書批次下載</h1>
    <p>選擇年份、輸入上市公司代碼，一次下載多家公司的中文永續報告書。</p>

    <form id="report-form">
      <label for="year">報告年度</label>
      <select id="year" name="year" required></select>

      <label for="company-codes">上市公司代碼</label>
      <textarea id="company-codes" name="company_codes" rows="4"
        maxlength="1000" placeholder="例如 2330、2454、1101"
        aria-describedby="code-help" required></textarea>
      <p class="note" id="code-help">
        可用逗號、空格或換行分隔。每次最多 50 家，重複代碼只處理一次。
      </p>

      <button id="start-download" type="submit">批次下載</button>
      <p id="status" role="status"></p>
      <ul id="results" aria-label="各公司處理結果" hidden></ul>
      <a id="zip-link" class="download" hidden>下載 ZIP</a>
    </form>
  </main>

  <script>
    // 在 GitHub Pages 使用時，填入已部署的 Python 後端 HTTPS 網址。
    // 使用 app.py 在本機開啟網頁時，可保留空字串。
    const backendUrl = "";

    const form = document.querySelector("#report-form");
    const yearSelect = document.querySelector("#year");
    const companyInput = document.querySelector("#company-codes");
    const submitButton = document.querySelector("#start-download");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");
    const zipLink = document.querySelector("#zip-link");

    const resultLabels = {
      downloaded: "下載成功",
      not_found: "查無中文報告",
      query_failed: "查詢失敗",
      download_failed: "下載失敗",
    };

    let zipUrl;

    for (let year = 2025; year >= 2015; year--) {
      yearSelect.add(new Option(String(year), String(year)));
    }

    function clearResults() {
      results.replaceChildren();
      results.hidden = true;
      zipLink.hidden = true;
      zipLink.removeAttribute("href");

      if (zipUrl) {
        URL.revokeObjectURL(zipUrl);
        zipUrl = undefined;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submitButton.disabled) return;

      clearResults();

      const codes = [...new Set(
        companyInput.value.normalize("NFKC").split(/[\s,、;]+/u).filter(Boolean)
      )];

      if (!codes.length || codes.length > 50 || codes.some(code => !/^[0-9]{4}$/.test(code))) {
        status.textContent = "請輸入 1～50 個四位數上市公司代碼，例如 2330、2454。";
        return;
      }

      if (location.protocol === "file:") {
        status.textContent = "請執行 python app.py，再開啟 http://127.0.0.1:8000。";
        return;
      }

      if (location.hostname.endsWith(".github.io") && !backendUrl) {
        status.textContent = "此頁尚未設定 Python 下載服務。";
        return;
      }

      const year = Number(yearSelect.value);
      const endpoint = `${backendUrl.replace(/\/+$/, "")}/api/download`;
      submitButton.disabled = true;
      status.textContent = `正在處理 ${year} 年度的 ${codes.length} 家公司，請稍候。`;

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ year, company_codes: codes }),
        });

        const contentType = response.headers.get("Content-Type") || "";
        if (!response.ok) {
          const error = contentType.includes("application/json")
            ? (await response.json()).error
            : "下載服務暫時無法處理請求。";
          throw new Error(error);
        }

        let companyResults;
        if (contentType.includes("application/zip")) {
          const summary = response.headers.get("X-ESG-Results");
          if (!summary) throw new Error("下載服務未提供公司處理結果。");

          companyResults = JSON.parse(summary);
          zipUrl = URL.createObjectURL(await response.blob());
          zipLink.href = zipUrl;
          zipLink.download = `ESG_${year}.zip`;
          zipLink.hidden = false;
        } else if (contentType.includes("application/json")) {
          companyResults = (await response.json()).results;
        } else {
          throw new Error("下載服務回傳了無法辨識的內容。");
        }

        let successCount = 0;
        for (const code of codes) {
          const result = companyResults[code];
          if (result === "downloaded") successCount++;

          const item = document.createElement("li");
          item.textContent = `${code}｜${resultLabels[result] || "處理失敗"}`;
          results.append(item);
        }

        results.hidden = false;
        status.textContent = `${year} 年度處理完成，成功取得 ${successCount} / ${codes.length} 份報告。`;
      } catch (error) {
        clearResults();
        status.textContent = error instanceof TypeError
          ? "無法連線到下載服務，請確認服務已啟動後再試。"
          : error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
